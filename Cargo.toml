[workspace]
resolver = "2"
members = [
    "crates/net",
    "crates/dom",
    "crates/html-parser",
    "crates/css-engine",
    "crates/layout",
    "crates/render",
    "crates/storage",
    "crates/navigation",
    "crates/cookie",
    "crates/eventloop",
    "crates/js-runtime",
    "crates/gui",
    "crates/cli",
    "crates/ws",
    "crates/cdp",
    "crates/svgine-host",
    "crates/extractor",
    "crates/worker-wasm",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.75"
authors = ["Browser Authors"]
license = "MIT"
repository = ""
description = "A cross-platform, low-memory browser for SPA rendering and scraping"

[workspace.dependencies]
# 异步运行时
tokio = { version = "1", features = ["full"] }

# 错误处理
thiserror = "1"
anyhow = "1"

# 日志
tracing = "0.1"
tracing-subscriber = "0.3"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 测试工具（dev-dependency）
wiremock = "0.6"
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

# M94.4: rquickjs-sys 本地 vendor——quickjs.c 的 JS_EvalObject 加 eval 体
# dump 钩子（BROWSER_DUMP_EVAL 门控）。VM 探测代码在运行时直接 eval 的
# 明文体里（OP_eval 字节码级，JS 层 wrap 不可达）——破译 hasModifiedCanvas
# 的唯一观测口。详见 docs/decisions/ADR-0005-js-eval-dump.md。
[patch.crates-io]
rquickjs-sys = { path = "vendor/rquickjs-sys" }
