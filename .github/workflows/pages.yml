name: GitHub Pages

on:
  push:
    branches: [main]
    paths: ['docs/site/**', 'data/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Include data directory
        run: |
          mkdir -p docs/site/data
          for f in data/*.md; do
            case "$f" in *.failed.md) continue;; esac
            cp "$f" docs/site/data/ 2>/dev/null || true
          done
          ls -la docs/site/data/ || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
      - id: deployment
        uses: actions/deploy-pages@v4
