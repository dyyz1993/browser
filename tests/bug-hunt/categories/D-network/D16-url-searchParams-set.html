<!DOCTYPE html><html><head><meta charset="utf-8"><title>URLSearchParams set/delete/sort</title></head>
<body><div id="out"></div>
<script>
var o = document.getElementById('out');
function w(line){ o.appendChild(document.createTextNode(line + '\\n')); }
function assert(name, cond, detail){ w(name + ':' + (cond ? 'PASS' : 'FAIL' + (detail?('('+detail+')'):''))); }
function safe(fn){ try{ return fn(); }catch(e){ return '__THREW__:' + e.message; } }
try {
var p=new URLSearchParams('a=1&b=2&a=3');
         assert('usp-get', p.get('a')==='1'); p.set('a','x'); assert('usp-set', p.get('a')==='x');
         p.delete('b'); assert('usp-del', p.get('b')===null);
         p.sort(); assert('usp-sort', true);
} catch(e) {
  w('__SCRIPT_THREW__:' + e.message);
}
</script></body></html>
