<!DOCTYPE html><html><head><meta charset="utf-8"><title>fetch 非跨域 CORS</title></head>
<body><div id="out"></div>
<script>
var o = document.getElementById('out');
function w(line){ o.appendChild(document.createTextNode(line + '\n')); }
function assert(name, cond, detail){ w(name + ':' + (cond ? 'PASS' : 'FAIL' + (detail?('('+detail+')'):''))); }
function safe(fn){ try{ return fn(); }catch(e){ return '__THREW__:' + e.message; } }
try {
fetch('/categories/D-network/D16-fetch-cors-simple.html').then(function(r){assert('fcors-ok',r.status===200);}).catch(function(e){assert('fcors-err',false,e.message);});
} catch(e) {
  w('__SCRIPT_THREW__:' + e.message);
}
</script></body></html>
