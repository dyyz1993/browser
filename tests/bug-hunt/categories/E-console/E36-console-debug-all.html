<!DOCTYPE html><html><head><meta charset="utf-8"><title>console 各种方法不抛</title></head>
<body><div id="out"></div>
<script>
var o = document.getElementById('out');
function w(line){ o.appendChild(document.createTextNode(line + '\\n')); }
function assert(name, cond, detail){ w(name + ':' + (cond ? 'PASS' : 'FAIL' + (detail?('('+detail+')'):''))); }
function safe(fn){ try{ return fn(); }catch(e){ return '__THREW__:' + e.message; } }
try {
try{console.debug('d');console.trace('t');console.dirxml({});}catch(e){assert('cda-err',false,e.message);}
         assert('cda-ok', true);
} catch(e) {
  w('__SCRIPT_THREW__:' + e.message);
}
</script></body></html>
