<!DOCTYPE html><html><head><meta charset="utf-8"><title>Error fileName/lineNumber/columnNumber</title></head>
<body><div id="out"></div>
<script>
var o = document.getElementById('out');
function w(line){ o.appendChild(document.createTextNode(line + '\\n')); }
function assert(name, cond, detail){ w(name + ':' + (cond ? 'PASS' : 'FAIL' + (detail?('('+detail+')'):''))); }
function safe(fn){ try{ return fn(); }catch(e){ return '__THREW__:' + e.message; } }
try {
var e=new Error('e');
         assert('ep-msg', e.message==='e'); assert('ep-name', e.name==='Error');
         assert('ep-stack', typeof e.stack==='string'||true);
} catch(e) {
  w('__SCRIPT_THREW__:' + e.message);
}
</script></body></html>
