[package]
name = "browser-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cross-platform GUI window for the browser (winit + softbuffer)"

[dependencies]
fontdue = "0.9"
# GUI 窗口（跨平台，事件循环）
winit = { version = "0.30", features = ["rwh_06"] }
# 字体（系统默认 sans-serif）
softbuffer = "0.4"

[dev-dependencies]

[[example]]
name = "gui_demo"
path = "examples/gui_demo.rs"
