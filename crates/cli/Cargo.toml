[package]
name = "browser-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command-line entry point for the browser project"

[[bin]]
name = "browser"
path = "src/main.rs"

[dependencies]
browser-dom = { path = "../dom" }
browser-html-parser = { path = "../html-parser" }
browser-net = { path = "../net" }
browser-cookie = { path = "../cookie" }
url = "2"
browser-css-engine = { path = "../css-engine" }
browser-layout = { path = "../layout" }
browser-render = { path = "../render" }
# M12.1: PNG output for --screenshot flag (fontdue for glyphs, embedded DejaVuSans).
fontdue = "0.9"
png = "0.17"
# M12.3: image decoding for ASCII art rendering (~30k lines, <10w threshold).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
browser-js-runtime = { path = "../js-runtime" }
browser-cdp = { path = "../cdp" }
# M81.E1: GUI 改为可选 feature（默认关闭）。winit 在 Linux 上动态链接
# X11/wayland/xkbcommon，headless 容器部署（CF Containers 等）不需要；
# 窗口模式用 `--features gui` 重新构建。
browser-gui = { path = "../gui", optional = true }
# M59: fetch 命令的后置内容提取（html/text/markdown/links + 噪声过滤）。
browser-extractor = { path = "../extractor" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = { workspace = true }
libc = "0.2"
# M-cls.1: 内存自愈护栏。把危险的 JS eval 放进子进程，子进程启动即
# setrlimit(RLIMIT_AS) 设硬上限，超限内核直接 SIGKILL 子进程，父进程
# 把它当"JS 失败"优雅降级（走 CSR 兜底）。杜绝单页 SPA 把宿主吃满 40GB。
rlimit = "0.11"
# M70.12: HTTP API 服务的 JSON 序列化
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
wiremock = "0.6"
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
# M96.4: V8 引擎透传
v8 = ["browser-js-runtime/v8", "browser-cdp/v8"]
default = ["quickjs"]
# M81.E1: GUI 窗口（winit+softbuffer）。默认不编译——容器/服务器部署零图形依赖。
gui = ["dep:browser-gui"]
# M66: QuickJS JS 引擎后端（默认引擎）
quickjs = ["browser-js-runtime/quickjs"]
# M71.1: boa 引擎后端（备选，默认不编译）。同时转发给 cdp/js-runtime，
# 让两个 crate 内部的 cfg(feature="boa") 都生效。
boa = ["browser-js-runtime/boa", "browser-cdp/boa"]
