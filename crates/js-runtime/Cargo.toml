[package]
name = "browser-js-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "JavaScript engine embedding + DOM bridge"

[dependencies]
browser-dom = { path = "../dom" }
browser-storage = { path = "../storage" }
browser-navigation = { path = "../navigation" }
browser-cookie = { path = "../cookie" }
browser-eventloop = { path = "../eventloop" }
browser-net = { path = "../net" }
browser-ws = { path = "../ws" }
boa_engine = "0.21"
tokio = { workspace = true, features = ["rt", "net"] }
url = "2"

[dev-dependencies]
browser-html-parser = { path = "../html-parser" }
wiremock = "0.6"
tokio = { workspace = true, features = ["macros", "rt"] }
assert_cmd.workspace = true
