[package]
name = "browser-js-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "JavaScript engine embedding + DOM bridge"

[dependencies]
browser-dom = { path = "../dom" }
browser-storage = { path = "../storage" }
browser-net = { path = "../net" }
boa_engine = "0.20"
tokio = { workspace = true, features = ["rt", "net"] }
url = "2"

[dev-dependencies]
browser-html-parser = { path = "../html-parser" }
wiremock = "0.6"
tokio = { workspace = true, features = ["macros", "rt"] }
