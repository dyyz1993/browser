[package]
name = "browser-js-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "JavaScript engine embedding + DOM bridge"

[dependencies]
browser-dom = { path = "../dom" }
browser-storage = { path = "../storage" }
browser-navigation = { path = "../navigation" }
browser-cookie = { path = "../cookie" }
browser-eventloop = { path = "../eventloop" }
browser-net = { path = "../net", default-features = false }
browser-ws = { path = "../ws" }
# M78: offsetWidth mini 级联（parse + compute_styles 取元素 width）。
browser-css-engine = { path = "../css-engine" }
# M62/M71.1: boa 引擎——M71.1 起降为 optional feature（默认 quickjs）。
# 用 git main 分支（crates.io 0.21.1 的 Error.stack 未完整，main 已修）。
boa_engine = { git = "https://github.com/boa-dev/boa", branch = "main", optional = true }
# M66: QuickJS 后端（rquickjs 绑定，bindgen 编译 QuickJS C 代码）
rquickjs = { version = "0.12", features = ["bindgen", "loader"], optional = true }
rquickjs-core = { version = "0.12", features = ["loader"], optional = true }
tokio = { workspace = true, features = ["rt", "net"] }
url = "2"
# M94: canvas 2D 真像素实现（fontdue 光栅化 + PNG 编码）——白名单依赖
# 复用（render/screenshot 已用同库），非新增依赖项。
fontdue = "0.9"
png = "0.17"
# M62: innerHTML setter 解析 HTML 为真实 DOM 节点（docsify 渲染管线必需）。
browser-html-parser = { path = "../html-parser" }
# M95/ADR-0006: V8 引擎后端（可选，默认不编译——需 --features v8。
# 与 Chrome 同源：etsl/toSourceError/canvasFingerprint 三差异一次消解。
v8 = { version = "152.2.0", optional = true }

[dev-dependencies]
browser-dom = { path = "../dom" }
wiremock = "0.6"
tokio = { workspace = true, features = ["macros", "rt"] }
assert_cmd.workspace = true
tempfile = "3"

[features]
# M96.20: TLS 后端链（net 默认 native；chrome-tls 全功能构建从 cli 层
# --no-default-features 断链排除 native-tls）。
net-tls-native = ["browser-net/tls-native"]
default = ["quickjs", "net-tls-native"]
# M66: QuickJS JS 引擎后端（rquickjs，默认引擎）
quickjs = ["dep:rquickjs", "dep:rquickjs-core"]
# M71.1: boa 引擎后端（备选，降为 optional。默认不编译，需 --features boa）。
boa = ["dep:boa_engine"]
# M95/ADR-0006: V8 引擎后端（可选，默认 QuickJS 不受影响）。
v8 = ["dep:v8"]

[[example]]
name = "v8_smoke"
required-features = ["v8"]
