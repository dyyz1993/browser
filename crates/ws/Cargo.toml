[package]
name = "browser-ws"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RFC 6455 WebSocket frame codec (hand-written, no tungstenite)"

[lib]
name = "browser_ws"
path = "src/lib.rs"

[dependencies]
thiserror = { workspace = true }
tokio = { workspace = true }
url = "2"
# M96.20: rustls（与 net 主栈一致）——TLS 后端全线去 openssl：boring 与
# openssl 同进程在 Linux 触发堆损坏（free invalid pointer，shanbox 实证）。
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pki-types = "1"
webpki-roots = "0.26"

[dev-dependencies]
tokio = { workspace = true }
