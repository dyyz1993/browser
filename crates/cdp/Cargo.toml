[package]
name = "browser-cdp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Chrome DevTools Protocol (CDP) server — exposes browser to Puppeteer/Playwright."

[dependencies]
browser-ws = { path = "../ws" }
browser-net = { path = "../net" }
browser-dom = { path = "../dom" }
browser-html-parser = { path = "../html-parser" }
browser-css-engine = { path = "../css-engine" }
browser-layout = { path = "../layout" }
browser-render = { path = "../render" }
browser-js-runtime = { path = "../js-runtime" }
png = "0.17"
tokio = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[features]
default = ["quickjs"]
# M67: QuickJS JS 引擎后端（转发到 js-runtime）。CDP Runtime domain 默认走 QuickJS。
quickjs = ["browser-js-runtime/quickjs"]
