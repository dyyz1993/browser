[package]
name = "browser-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "HTTP / HTTPS / WebSocket client for the browser project"

[dependencies]
# M24: 从 hyper-rustls(ring) 切换到 reqwest(default-tls/native-tls)。
# 根因：hyper-rustls 的 ring provider 与百度等中国大站 CDN 的 TLS 实现不兼容
# （AlertReceived(ProtocolVersion)），而系统 TLS 库（native-tls，curl 同款）能连。
# 连真实站点是 GOALS.md 最高优先级（G1 爬虫），高于"纯 Rust 依赖"原则。
#
# M58: 启用 brotli/gzip/deflate 解码特性。Vercel/Cloudflare 等现代 CDN 默认对
# text/html 等大响应做 brotli 压缩（content-encoding: br）。缺这些特性时 reqwest
# 收到压缩字节流按明文解码，报 "error decoding response body"，导致整站爬取失败。
# 这些是 reqwest 官方解码 feature（非新 crate），属白名单 reqwest 的合理配置。
# M96.18/ADR-0007: Chrome 同源 TLS 通道（BoringSSL = Chromium 同源库）。
# optional——默认不编译，--features chrome-tls 启用。
boring = { version = "4", optional = true }
tokio-boring = { version = "4", optional = true }
h2 = { version = "0.4", optional = true }
http = { version = "1", optional = true }
bytes = { version = "1", optional = true }
# M96.20: native-tls 由 feature `tls-native` 开（默认）——chrome-tls 构建
# 显式 --no-default-features 时排除：boring（静态 BoringSSL）与系统
# libssl 同进程会同名符号冲突（Linux 堆损坏 root cause）。
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "http2",
    "charset",
    "brotli",
    "gzip",
    "deflate",
] }
tokio = { workspace = true }
url = "2"
thiserror = { workspace = true }
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
async-trait = "0.1"

[dev-dependencies]
tokio = { workspace = true }
wiremock = "0.6"
futures = "0.3"

[features]
default = ["tls-native"]
# M96.20: reqwest native-tls（openssl/SecurityFramework）——默认开，
# chrome-tls 全功能构建用 --no-default-features 排除（见上）。
tls-native = ["reqwest/default-tls", "reqwest/native-tls"]
# M96.18: Chrome 同源 TLS（BoringSSL）+ H2 通道。默认关闭。
chrome-tls = ["dep:boring", "dep:tokio-boring", "dep:h2", "dep:http", "dep:bytes"]
# M96.20: 交叉编译便利——openssl 源码自编译（zigbuild 到 Linux 时无系统
# OpenSSL 可链）。默认关闭，macOS 本机构建零影响。
native-tls-vendored = ["reqwest/native-tls-vendored"]
