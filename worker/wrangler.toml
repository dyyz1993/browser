name = "browser-fetch"
main = "src/index.js"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

# 自定义域名（国内可访问）
routes = [
  { pattern = "fetch.xbrowser.dev/*", zone_id = "c8bcaac5f6645a9b0b3f1b2323203b52" }
]

# wasm 由 wasm-pack 生成到 ../crates/worker-wasm/pkg/
rules = [
  { type = "Text", globs = ["**/ui.html"] },
  { type = "CompiledWasm", globs = ["**/*.wasm"], fallthrough = false }
]

# M70.12: BROWSER_BACKEND — 可选的后端服务地址
# 如果设置，Worker 会转发 scrape 请求到这个后端做完整 JS 渲染。
# 后端运行 `browser serve` 命令（Rust 二进制 + QuickJS 引擎）。
# 格式示例：http://your-server.com
